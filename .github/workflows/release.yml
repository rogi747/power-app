name: Release

on:
  workflow_call:
    inputs:
      dry-run:
        description: 'Compiles the app but not upload artifacts to distribution server'
        default: false
        required: false
        type: boolean
    secrets:
      GH_TOKEN:
        required: true
      BUILD_CERTIFICATE_BASE64:
        required: true
      P12_PASSWORD:
        required: true
      KEYCHAIN_PASSWORD:
        required: true
      APPLE_IDENTITY:
        required: true
      VITE_APP_API:
        required: true
      VITE_START_PAGE_URL:
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  draft_release:
    permissions:
      contents: write

    strategy:
      fail-fast: false  # Change to false to allow other platforms to continue if one fails
      matrix:
        include:
          - os: windows-2022
            arch: x64
            platform: win
          - os: macos-latest
            arch: x64
            platform: mac-x64
          - os: macos-latest
            arch: arm64
            platform: mac-arm64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Git LFS
        run: |
          git lfs install
          git lfs pull

      # Configure environment variables
      - name: Configure environment
        shell: bash
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 1
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          NODE_PRE_GYP_MIRROR: "https://npmmirror.com/mirrors/node-pre-gyp/"
        run: |
          echo "Environment configured"
          # Set platform-specific environment variables
          if [ "${{ matrix.platform }}" == "win" ]; then
            echo "ELECTRON_PLATFORM=win32" >> $GITHUB_ENV
            echo "ELECTRON_ARCH=x64" >> $GITHUB_ENV
            echo "GYP_MSVS_VERSION=2022" >> $GITHUB_ENV
          elif [ "${{ matrix.platform }}" == "mac-arm64" ]; then
            echo "ELECTRON_PLATFORM=darwin" >> $GITHUB_ENV
            echo "ELECTRON_ARCH=arm64" >> $GITHUB_ENV
          elif [ "${{ matrix.platform }}" == "mac-x64" ]; then
            echo "ELECTRON_PLATFORM=darwin" >> $GITHUB_ENV
            echo "ELECTRON_ARCH=x64" >> $GITHUB_ENV
          fi

      # Cache dependencies
      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            ~/.cache/electron
            ~/.cache/node-gyp
          key: ${{ runner.os }}-${{ matrix.arch }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-npm-

      # macOS specific settings
      - name: Setup macOS build tools
        if: startsWith(matrix.platform, 'mac')
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          sudo xcodebuild -license accept
          
          # Install Python 3.11
          brew install python@3.11 make gcc
          
          # Set Python path
          echo "PYTHON=/opt/homebrew/opt/python@3.11/bin/python3.11" >> $GITHUB_ENV
          
          # Install setuptools
          /opt/homebrew/opt/python@3.11/bin/python3.11 -m pip install setuptools

      # Setup Node.js
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install native modules
        run: npm install --ignore-scripts sqlite3 electron

      - name: Rebuild native modules
        if: matrix.os == 'macos-latest'
        run: |
          npm rebuild sqlite3 --build-from-source --python=/opt/homebrew/opt/python@3.11/bin/python3.11

      - name: Install dependencies
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm ci --verbose
        env:
          ELECTRON_PLATFORM: ${{ env.ELECTRON_PLATFORM }}
          ELECTRON_ARCH: ${{ env.ELECTRON_ARCH }}
          GYP_MSVS_VERSION: 2022
          npm_config_msvs_version: 2022

      - name: Build Native Addon
        run: node scripts/build-native-addon.js
        env:
          ELECTRON_PLATFORM: ${{ env.ELECTRON_PLATFORM }}
          ELECTRON_ARCH: ${{ env.ELECTRON_ARCH }}
          GYP_MSVS_VERSION: 2022
          npm_config_msvs_version: 2022
      # Install Apple certificates
      - name: Install Apple certificates
        if: startsWith(matrix.platform, 'mac')
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "No certificate provided, skipping..."
            exit 0
          fi
          CERTIFICATE_PATH=$HOME/certificates
          KEYCHAIN_PATH=$HOME/Library/Keychains/build.keychain-db
          
          mkdir -p $CERTIFICATE_PATH
          echo "$BUILD_CERTIFICATE_BASE64" | base64 -D > $CERTIFICATE_PATH/certificate.p12
          
          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          
          # Import certificates
          security import $CERTIFICATE_PATH/certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      # Create environment config
      - name: Create .env.production.local
        run: |
          echo "VITE_APP_API=${{ secrets.VITE_APP_API }}" > .env.production.local
          echo "VITE_START_PAGE_URL=${{ secrets.VITE_START_PAGE_URL }}" >> .env.production.local

      # Build project
      - name: Build Project
        run: npm run build

      # Build and release project (using electron-builder built-in release feature)
      - name: Build and Publish for Windows
        if: matrix.platform == 'win'
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          shell: bash
          command: npx electron-builder --win --config .electron-builder.config.js --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          BUILD_TIME: ${{ github.run_number }}

      - name: Build and Publish for macOS x64
        if: matrix.platform == 'mac-x64'
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          shell: bash
          command: npx electron-builder --mac --x64 --config .electron-builder.config.js --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          BUILD_TIME: ${{ github.run_number }}
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          ELECTRON_ARCH: x64

      - name: Build and Publish for macOS arm64
        if: matrix.platform == 'mac-arm64'
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          shell: bash
          command: npx electron-builder --mac --arm64 --config .electron-builder.config.js --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          BUILD_TIME: ${{ github.run_number }}
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          ELECTRON_ARCH: arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build-${{ github.run_number }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
          retention-days: 7

      # # macOS specific: sign native modules (if needed)
      # - name: Sign native modules (macOS)
      #   if: startsWith(matrix.platform, 'mac') && !inputs.dry-run
      #   env:
      #     APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
      #   run: |
      #     node scripts/sign-native-modules.js

